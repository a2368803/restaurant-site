<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#8b5e3c">

  <!-- ── SEO 基底（動態覆寫）──────────────────────── -->
  <title>餐廳</title>
  <meta name="description" content="">
  <meta name="keywords" content="餐廳,美食,訂位">
  <meta name="robots" content="index, follow">

  <!-- Open Graph -->
  <meta property="og:type"        content="restaurant.restaurant">
  <meta property="og:site_name"   content="">
  <meta property="og:title"       content="餐廳">
  <meta property="og:description" content="">
  <meta property="og:url"         content="https://wadawww.vercel.app/">

  <meta property="og:image"        content="">

  <meta property="og:image:height" content="">

  <!-- Twitter Card -->

  <meta name="geo.region"   content="TW">
  <meta name="geo.placename" content="">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <!-- ── 極早期執行：Session ID + FB Pixel 快取 ─── -->
  <script>
  (function(){
    if (!sessionStorage.getItem('_sid')) {
      sessionStorage.setItem('_sid',
        (typeof crypto !== 'undefined' && crypto.randomUUID)
          ? crypto.randomUUID()
          : Date.now().toString(36) + Math.random().toString(36).slice(2)
      );
    }
    var pid = localStorage.getItem('_fbpx');
    if (!pid) return;
    !function(f,b,e,v,n,t,s){
      if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)
    }(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', pid);
    fbq('track', 'PageView');
  })();
  </script>
</head>
<body>

  <!-- ── 今日優惠彈跳視窗 ─────────────────────── -->
  <div id="promo-overlay" class="promo-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="promo-popup-title">
    <div class="promo-card">
      <button id="promo-close" class="promo-close" aria-label="關閉">✕</button>
      <h2 id="promo-popup-title" class="promo-popup-title"></h2>
      <img id="promo-img" class="promo-img" src="" alt="今日優惠圖片" style="display:none;">
      <p id="promo-body" class="promo-body"></p>
    </div>
  </div>

  <!-- ── 媒體列表（照片 + 影片依序排列）────────── -->
  <main id="media-section" class="media-section" aria-label="媒體列表"></main>

  <!-- ── SEO / GEO 語意內容（爬蟲可見，視覺隱藏）── -->
  <div id="seo-content" class="seo-only" aria-hidden="true"></div>

  <!-- ── 地址 + 地圖 ──────────────────────────── -->
  <section id="address-section" class="address-section">
    <p class="section-label">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
      地址
    </p>
    <p id="address-text" class="address-text"></p>
    <div id="map-wrapper" class="map-wrapper"></div>
  </section>

  <!-- ── Footer ───────────────────────────────── -->
  <footer class="site-footer">
    <span id="footer-name"></span>
  </footer>

  <!-- ── 固定在底部的 CTA 按鈕 ────────────────── -->
  <div class="sticky-ctas">
    <a id="cta-call" class="cta-btn cta-call hidden" href="tel:">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13.5 19.79 19.79 0 0 1 1.61 4.93 2 2 0 0 1 3.59 2.73h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6.08 6.08l1.26-.91a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      立即來電
    </a>
    <a id="cta-reservation" class="cta-btn cta-reservation hidden" href="#" target="_blank" rel="noopener">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      線上訂位
    </a>
  </div>

  <!-- ── Scripts ──────────────────────────────── -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
